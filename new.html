<!DOCTYPE html>
<html>
<head>
<title>KML Display</title>
<script>
async function checkAndUpdateIframe() {
  const webAppUrl = "https://script.google.com/macros/s/AKfycbxZwEkEGlbF9bWH-IWkLB2xtQJEMZPdyvkSx18qI6xg_pDlwLBZ1_VnVzpXZ3qII0r8IA/exec";
  
  // Extract 'id' parameter from current web page URL (e.g., page.html?id=C10649)
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (!id) {
    console.warn("No 'id' parameter found in the URL query string.");
    return;
  }

  try {
    const response = await fetch(`${webAppUrl}?id=${encodeURIComponent(id)}`);
    const pageToLoad = (await response.text()).trim();
    
    const iframe = document.getElementById("iframe_target");
    if (!iframe) {
      console.error("Target iframe with ID 'iframe_target' not found.");
      return;
    }

    // Compare current src attribute to avoid unnecessary reloads
    const currentSrc = iframe.getAttribute("src");
    
    if (currentSrc !== pageToLoad) {
      iframe.src = pageToLoad;
      console.log(`Updated iframe src to: ${pageToLoad}`);
    } else {
      console.log("Iframe src unchanged. Skipping reload.");
    }
  } catch (error) {
    console.error("Error fetching data from Apps Script:", error);
  }
}

// Execute immediately on initial page load
checkAndUpdateIframe();

// Run automatically once every minute (60,000 milliseconds)
setInterval(checkAndUpdateIframe, 60000);
</script>
</head>
<body style="margin:0;background-color=black;overflow: hidden;">
<iframe 
  src="display.html"
  height="1080"
  width="1920"
  style="border:none;"
  id="iframe_target"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
  allowfullscreen>
</iframe>
</body>
</html>
