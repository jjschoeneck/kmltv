<!DOCTYPE html>
<html>
<head>
<title>KML Display</title>
<script>
async function getPageToLoad() {
  const webAppUrl = "https://script.google.com/macros/s/AKfycbxZwEkEGlbF9bWH-IWkLB2xtQJEMZPdyvkSx18qI6xg_pDlwLBZ1_VnVzpXZ3qII0r8IA/exec";
  
  // Extract 'id' parameter from current web page URL (e.g., page.html?id=123)
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (!id) {
    console.warn("No 'id' parameter found in the URL query string.");
    return;
  }

  try {
    const response = await fetch(`${webAppUrl}?id=${encodeURIComponent(id)}`);
    const pageToLoad = await response.text();
    
    console.log("Page to Load:", pageToLoad);
  } catch (error) {
    console.error("Error fetching data from Apps Script:", error);
  }
}

// Execute on page load
getPageToLoad();
</script>
</head>
<body style="margin:0;background-color=black;overflow: hidden;">
<iframe src="display.html" height="1080" width="1920" style="border:none;" id="iframe_target"></iframe>
</body>
</html>
